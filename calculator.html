<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home Loan & EMI Calculator | ABB Construction</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #1e293b;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 8%;
      background-color: #0f172a;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      text-decoration: none;
    }

    .logo span {
      color: #f59e0b;
    }

    nav a {
      color: #cbd5e1;
      text-decoration: none;
      margin-left: 20px;
      font-size: 15px;
      font-weight: 500;
      transition: color 0.3s;
    }

    nav a:hover, nav a.active {
      color: #f59e0b;
    }

    .btn-contact {
      background-color: #f59e0b;
      color: #0f172a;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      margin-left: 20px;
    }

    .container {
      max-width: 900px;
      margin: 60px auto;
      padding: 0 20px;
    }

    .page-title {
      text-align: center;
      margin-bottom: 40px;
    }

    .page-title span {
      color: #f59e0b;
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .page-title h1 {
      font-size: 34px;
      color: #0f172a;
      margin-top: 10px;
      font-weight: 800;
    }

    .calculator-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    }

    .calc-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 40px;
    }

    .calc-inputs {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .calc-group label {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 8px;
    }

    .calc-group input[type="range"] {
      width: 100%;
      accent-color: #f59e0b;
      cursor: pointer;
    }

    .calc-result-box {
      background: #0f172a;
      color: #ffffff;
      border-radius: 12px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .calc-result-box span {
      color: #cbd5e1;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .calc-result-box h3 {
      font-size: 36px;
      color: #f59e0b;
      margin: 10px 0 25px 0;
      font-weight: 800;
    }

    .calc-breakdown {
      width: 100%;
      border-top: 1px solid #334155;
      padding-top: 20px;
      display: flex;
      justify-content: space-around;
      font-size: 13px;
      color: #94a3b8;
    }

    .calc-breakdown strong {
      display: block;
      color: #ffffff;
      font-size: 16px;
      margin-top: 4px;
    }

    .whatsapp-float {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background-color: #25d366;
      color: #ffffff;
      border-radius: 50px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
      z-index: 1000;
    }

    @media (max-width: 768px) {
      .calc-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">BUILD<span>TECH</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="services.html">Services</a>
      <a href="ongoing.html">Ongoing Project</a>
      <a href="calculator.html" class="active">EMI Calculator</a>
      <a href="contact.html" class="btn-contact">Get a Quote</a>
    </nav>
  </header>

  <div class="container">
    <div class="page-title">
      <span>Financial Planning</span>
      <h1>Home Loan & EMI Calculator</h1>
    </div>

    <div class="calculator-card">
      <div class="calc-grid">
        <div class="calc-inputs">
          <div class="calc-group">
            <label>
              <span>Loan Amount</span>
              <span id="loanVal">₹35,00,000</span>
            </label>
            <input type="range" id="loanAmount" min="1000000" max="10000000" step="50000" value="3500000">
          </div>

          <div class="calc-group">
            <label>
              <span>Interest Rate (% p.a.)</span>
              <span id="rateVal">8.5%</span>
            </label>
            <input type="range" id="interestRate" min="7.0" max="12.0" step="0.1" value="8.5">
          </div>

          <div class="calc-group">
            <label>
              <span>Loan Tenure (Years)</span>
              <span id="tenureVal">20 Years</span>
            </label>
            <input type="range" id="tenureYears" min="5" max="30" step="1" value="20">
          </div>
        </div>

        <div class="calc-result-box">
          <span>Monthly Payable EMI</span>
          <h3 id="monthlyEmi">₹30,374</h3>
          <div class="calc-breakdown">
            <div>
              Principal Amount
              <strong id="principalDisplay">₹35,00,000</strong>
            </div>
            <div>
              Total Interest
              <strong id="interestDisplay">₹37,89,760</strong>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

    <!-- WhatsApp Direct Button -->
    <a href="https://wa.me/919330781796?text=Hello%20ABB%20Construction,%20I%20want%20more%20details%20about%20your%20projects." 
    class="whatsapp-float" 
    target="_blank">
   💬 Chat on WhatsApp
 </a>


  <script>
    const loanSlider = document.getElementById('loanAmount');
    const rateSlider = document.getElementById('interestRate');
    const tenureSlider = document.getElementById('tenureYears');

    const loanVal = document.getElementById('loanVal');
    const rateVal = document.getElementById('rateVal');
    const tenureVal = document.getElementById('tenureVal');

    const monthlyEmi = document.getElementById('monthlyEmi');
    const principalDisplay = document.getElementById('principalDisplay');
    const interestDisplay = document.getElementById('interestDisplay');

    function calculateEMI() {
      const P = parseFloat(loanSlider.value);
      const r = parseFloat(rateSlider.value) / (12 * 100);
      const n = parseFloat(tenureSlider.value) * 12;

      loanVal.innerText = '₹' + P.toLocaleString('en-IN');
      rateVal.innerText = rateSlider.value + '%';
      tenureVal.innerText = tenureSlider.value + ' Years';

      const emi = (P * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
      const totalPayment = emi * n;
      const totalInterest = totalPayment - P;

      monthlyEmi.innerText = '₹' + Math.round(emi).toLocaleString('en-IN');
      principalDisplay.innerText = '₹' + Math.round(P).toLocaleString('en-IN');
      interestDisplay.innerText = '₹' + Math.round(totalInterest).toLocaleString('en-IN');
    }

    loanSlider.addEventListener('input', calculateEMI);
    rateSlider.addEventListener('input', calculateEMI);
    tenureSlider.addEventListener('input', calculateEMI);

    calculateEMI();
  </script>
</body>
</html>
