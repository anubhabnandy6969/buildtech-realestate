<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact & Book Site Visit | BuildTech</title>
  <style>
        /* Floating WhatsApp Button */
        .whatsapp-float {
      position: fixed;
      bottom: 25px;
      right: 25px;
      background-color: #25d366;
      color: #ffffff;
      border-radius: 50px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
      z-index: 1000;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .whatsapp-float:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #1e293b;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 8%;
      background-color: #0f172a;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      text-decoration: none;
    }

    .logo span {
      color: #f59e0b;
    }

    nav a {
      color: #cbd5e1;
      text-decoration: none;
      margin-left: 25px;
      font-size: 15px;
      font-weight: 500;
      transition: color 0.3s;
    }

    nav a:hover, nav a.active {
      color: #f59e0b;
    }

    .btn-contact {
      background-color: #f59e0b;
      color: #0f172a;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      margin-left: 25px;
    }

    .container {
      max-width: 800px;
      margin: 60px auto;
      padding: 0 20px;
    }

    .contact-card {
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
    }

    .contact-card h1 {
      font-size: 30px;
      color: #0f172a;
      margin-bottom: 10px;
    }

    .contact-card p {
      color: #64748b;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 8px;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #f59e0b;
    }

    .btn-submit {
      width: 100%;
      background: #f59e0b;
      color: #0f172a;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-submit:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">BUILD<span>TECH</span></a>
    <nav>
      <a href="index.html">Home</a>
      <a href="services.html">Services (G+4 to G+18)</a>
      <a href="ongoing.html">Ongoing Project</a>
      <a href="contact.html" class="btn-contact active">Get a Quote</a>
    </nav>
  </header>

  <div class="container">
    <div class="contact-card">
      <h1>Get in Touch</h1>
      <p>Schedule a site visit for ongoing flats or request structural contracting quotes.</p>

      <form action="https://api.web3forms.com/submit" method="POST">
        <!-- তোমার Web3Forms Access Key এখানে বসাও -->
        <input type="hidden" name="access_key" value="5f67649f-f81c-49e9-b168-a7daee2d5955" />

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" name="name" placeholder="Enter your full name" required />
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" name="phone" placeholder="Enter 10-digit mobile number" required />
        </div>

        <div class="form-group">
          <label>Inquiry Type</label>
          <select name="inquiry_type">
            <option>Buying a Flat (Emerald Heights)</option>
            <option>High-Rise Structural Contracting (G+4 to G+18)</option>
            <option>Land Joint Venture / Promoting</option>
          </select>
        </div>

        <div class="form-group">
          <label>Message (Optional)</label>
          <textarea name="message" rows="4" placeholder="Any specific requirements or queries..."></textarea>
        </div>

        <button type="submit" class="btn-submit">Submit Inquiry</button>
      </form>

    </div>
  </div>
  <script>
    const form = document.querySelector('form');
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      const name = form.querySelector('input[type="text"]').value;
      alert(`Thank you, ${name}! Your inquiry has been received. Our team will contact you shortly regarding the project details and site visit.`);
      
      form.reset();
    });
  </script>
 <!-- WhatsApp Direct Button -->

 class="whatsapp-float" 
 target="_blank">
💬 Chat on WhatsApp
</a>

</body>
</html>
